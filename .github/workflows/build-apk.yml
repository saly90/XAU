name: Build XAU AI APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/xauai/gold/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = 'price.text="XAU/USD  ${if(livePrice>0)fmt(livePrice)else"—"}  •  $tf"'
          new = 'val liveText=if(livePrice>0)fmt(livePrice)else"—";price.text="XAU/USD  $liveText  •  $tf"'
          if old not in s:
              raise SystemExit("expected source pattern not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk

# CI only normalizes one Kotlin string-expression parsing edge case; the checked-in logic is otherwise built as-is.
