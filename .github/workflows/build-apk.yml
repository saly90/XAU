name: Build XAU AI APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply safe structural level model
        run: python3 tools/safe_patch_levels.py
      - name: Apply MT5 live data engine
        run: python3 tools/apply_mt5_bridge.py
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk

# Verified build pipeline: preserve the correct SignalR string[] subscription payload.
